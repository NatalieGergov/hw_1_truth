<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AttendanceChimp</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 40px; }
        .bio { max-width: 600px; margin: 0 auto; }
        .username { font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>
<div class="bio">
    <h1>AttendanceChimp</h1>
    <p>Electronic class attendance tracking application.</p>
    <hr>

    <p>
        {% if user.is_authenticated %}
            User: <span class="username">{{ user.username }}</span>
        {% else %}
            User: <span class="username">Not logged in.</span>
        {% endif %}
    </p>

    <p>Current Time: {{current_time}} CST</p>

</div>
</body>
</html>
